services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/core
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sellpy:sellpy@db:5432/sellpydb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sellpydb
      POSTGRES_USER: sellpy
      POSTGRES_PASSWORD: sellpy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellpy"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
